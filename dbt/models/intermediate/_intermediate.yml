version: 2

models:
  - name: int_offers
    description: Une ligne par offre réelle, toutes sources confondues.
    columns:
      - name: offer_key
        data_tests: [unique, not_null]
  - name: int_offer_skills
    description: Compétences citées par chaque offre (seed skills).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [offer_key, skill]
