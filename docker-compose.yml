services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 127.0.0.1 only: n8n reaches this service over the internal Docker
    # network (hostname "db", port 5432) via network_mode: host below — the
    # host port is published solely for SSH-tunneled debugging (psql/DBeaver
    # from your laptop), never for direct internet exposure. Metabase (a
    # separate docker-compose project) reaches this service over the
    # "annonces-metabase-shared" external network instead, by container
    # name, not through this published port.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - annonces_pg_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    networks:
      - default
      - annonces-metabase-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  n8n:
    build:
      context: ./docker/n8n
    # network_mode: host lets n8n's Postgres node reach db via
    # 127.0.0.1:${POSTGRES_PORT} and, more importantly, lets the Send Email
    # node reach Proton Mail Bridge's SMTP proxy, which only listens on the
    # host's 127.0.0.1 — unreachable from an isolated Docker network.
    # N8N_LISTEN_ADDRESS is pinned to the VPS's Tailscale interface, not
    # 0.0.0.0 or 127.0.0.1: reachable from any device on the tailnet (no
    # SSH tunnel needed) while staying invisible on the public interface —
    # host networking would otherwise bind n8n to all host interfaces,
    # and ufw does not govern Docker-managed ports on this host.
    network_mode: host
    environment:
      N8N_LISTEN_ADDRESS: ${N8N_LISTEN_ADDRESS:-127.0.0.1}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SSL_KEY: ${N8N_SSL_KEY:-}
      N8N_SSL_CERT: ${N8N_SSL_CERT:-}
      GENERIC_TIMEZONE: Europe/Zurich
      # Adzuna/Jooble/DeepL credentials, read by the "Adzuna Search",
      # "Jooble Search" and "Traduction Deepl" nodes via {{ $env.VAR }}
      # expressions instead of being hardcoded in the node parameters —
      # keeps them out of every `n8n export:workflow` output.
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_API_KEY: ${ADZUNA_API_KEY}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      # Trusts Proton Mail Bridge's self-signed local SMTP certificate
      # without disabling TLS verification globally (which would also
      # weaken the DeepL HTTPS calls). Machine-specific: Bridge regenerates
      # this cert per install, so it's git-ignored and must be re-extracted
      # after every Bridge (re)install — see docker/n8n/certs/proton-bridge-ca.pem.
      NODE_EXTRA_CA_CERTS: /home/node/certs/proton-bridge-ca.pem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n/certs:/home/node/certs:ro
      - ./tailscale-certs:/home/node/tailscale-certs:ro
    depends_on:
      - db
    restart: unless-stopped

volumes:
  annonces_pg_data:
  n8n_data:

networks:
  annonces-metabase-shared:
    external: true
