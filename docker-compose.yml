services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 127.0.0.1 only: n8n and Metabase reach this service over the internal
    # Docker network (hostname "db", port 5432) since they run on the same
    # VPS — the host port is published solely for SSH-tunneled debugging
    # (psql/DBeaver from your laptop), never for direct internet exposure.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - annonces_pg_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro

  n8n:
    build:
      context: ./docker/n8n
    # network_mode: host lets n8n's Postgres node reach db via
    # 127.0.0.1:${POSTGRES_PORT} and, more importantly, lets the Send Email
    # node reach Proton Mail Bridge's SMTP proxy, which only listens on the
    # host's 127.0.0.1 — unreachable from an isolated Docker network.
    # N8N_LISTEN_ADDRESS restores a scoped exposure that the removed
    # "ports: 127.0.0.1:5678:5678" mapping used to provide, since host
    # networking would otherwise bind n8n to all host interfaces. Defaults
    # to localhost-only; set N8N_LISTEN_ADDRESS in .env to a Tailscale
    # interface IP (or similar) to reach n8n from other devices without
    # exposing it on the public interface.
    network_mode: host
    environment:
      N8N_LISTEN_ADDRESS: ${N8N_LISTEN_ADDRESS:-127.0.0.1}
      # n8n refuses to set its auth cookie over a non-localhost origin
      # unless served over HTTPS. On the VPS, N8N_PROTOCOL/SSL_KEY/SSL_CERT
      # point at a Tailscale-issued cert (`tailscale cert <magicdns-name>`,
      # renews on re-run — see docs/tailscale-cardtracker-instructions.md
      # for the equivalent DE_CARDTRACKER setup). Left empty/http for local
      # use, where n8n is reached via localhost and this doesn't apply.
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SSL_KEY: ${N8N_SSL_KEY:-}
      N8N_SSL_CERT: ${N8N_SSL_CERT:-}
      # n8n defaults to America/New_York when unset, which would fire the
      # "Daily 8am" schedule trigger at 8am New York time (14h en Suisse en
      # été) instead of 8h locales.
      GENERIC_TIMEZONE: Europe/Zurich
      # Trusts Proton Mail Bridge's self-signed local SMTP certificate
      # without disabling TLS verification globally (which would also
      # weaken the DeepL HTTPS calls). Machine-specific: Bridge regenerates
      # this cert per install, so it's git-ignored and must be re-extracted
      # after every Bridge (re)install — see docker/n8n/certs/proton-bridge-ca.pem.
      NODE_EXTRA_CA_CERTS: /home/node/certs/proton-bridge-ca.pem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n/certs:/home/node/certs:ro
      - ./tailscale-certs:/home/node/tailscale-certs:ro
    depends_on:
      - db
    restart: unless-stopped

volumes:
  annonces_pg_data:
  n8n_data:
