services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 127.0.0.1 only: n8n and Metabase reach this service over the internal
    # Docker network (hostname "db", port 5432) since they run on the same
    # VPS — the host port is published solely for SSH-tunneled debugging
    # (psql/DBeaver from your laptop), never for direct internet exposure.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - annonces_pg_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro

  n8n:
    build:
      context: ./docker/n8n
    # network_mode: host lets n8n's Postgres node reach db via
    # 127.0.0.1:${POSTGRES_PORT} and, more importantly, lets the Send Email
    # node reach Proton Mail Bridge's SMTP proxy, which only listens on the
    # host's 127.0.0.1 — unreachable from an isolated Docker network.
    # N8N_LISTEN_ADDRESS restores the localhost-only exposure that the
    # removed "ports: 127.0.0.1:5678:5678" mapping used to provide, since
    # host networking would otherwise bind n8n to all host interfaces.
    network_mode: host
    environment:
      N8N_LISTEN_ADDRESS: 127.0.0.1
      # Trusts Proton Mail Bridge's self-signed local SMTP certificate
      # without disabling TLS verification globally (which would also
      # weaken the DeepL HTTPS calls). Machine-specific: Bridge regenerates
      # this cert per install, so it's git-ignored and must be re-extracted
      # after every Bridge (re)install — see docker/n8n/certs/proton-bridge-ca.pem.
      NODE_EXTRA_CA_CERTS: /home/node/certs/proton-bridge-ca.pem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n/certs:/home/node/certs:ro
    depends_on:
      - db
    restart: unless-stopped

volumes:
  annonces_pg_data:
  n8n_data:
